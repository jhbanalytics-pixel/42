# Staging deploy of the 42 jobs (task 3.8, docs/full-42/SETUP.md "Deploys without anyone's PC").
# Runs on every push to full-42 and nowhere else. It signs in to ogilvy-trends-v2 as f42-deployer through
# the Workload Identity pool and provider that core/setup/bootstrap.py creates; no key is stored anywhere.
# It builds the jobs image for the pushed commit, deploys every job and the smoke jobs on that digest,
# then runs each smoke job. The f42-builder smoke role and the Scheduler dispatch check stay a PC step.
name: staging

on:
  push:
    branches: [full-42]

permissions:
  contents: read
  id-token: write

# One deploy at a time; a push that arrives mid-deploy waits for it instead of cancelling it.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'jhbanalytics-pixel/42-Ogilvy-Intelligence' && github.ref == 'refs/heads/full-42'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the jobs requirements
        run: python -m pip install --disable-pip-version-check -r core/setup/requirements-jobs.txt

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/590353929363/locations/global/workloadIdentityPools/f42-github/providers/f42-github-staging
          service_account: f42-deployer@ogilvy-trends-v2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build the jobs image and deploy the jobs
        run: python core/setup/deploy_jobs.py --build --apply

      - name: Deploy the smoke jobs on the same image
        run: python core/setup/deploy_jobs.py --smoke --apply

      - name: Run the smoke jobs
        run: |
          python - <<'EOF'
          import subprocess
          import sys

          from core.setup import deploy_jobs as dj

          gcloud = dj.Gcloud().path
          failed = []
          for job in dj.SMOKE_JOBS:
              print(dj.show(dj.execute_argv(job)), flush=True)
              if subprocess.run([gcloud, *dj.execute_argv(job)], stdin=subprocess.DEVNULL).returncode:
                  failed.append(job.name)
          sys.exit(f"Smoke failed: {', '.join(failed)}" if failed else 0)
          EOF
