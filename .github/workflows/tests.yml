# Test-only workflow for 42. It reads the repository and runs the tests. It signs in to nothing, holds no secret,
# builds only the local frontend bundle its tests read and ships nothing; the workflows that sign in, build images
# and deploy stay parked in .github/parked-workflows.
# core/eval/tests/harness/test_harness_ci_workflow.py fails if this file ever asks for more than that.
#
# Native opt-in tests (live BigQuery dry runs behind F42_BQ=1, the packaged Linux browser behind
# PDF_RENDERER_NATIVE=1) are never run here. They show as skipped, and the skip report lists them by count.
name: tests

on:
  pull_request:
    branches: [main, full-42, "release/**"]
  push:
    branches: [main, full-42, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  F42_BQ: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # Full history, because a core test reads a file from origin/full-42 with git show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refuse a native opt-in run
        run: |
          if [ "${F42_BQ}" != "0" ] || [ -n "${PDF_RENDERER_NATIVE:-}" ]; then
            echo "F42_BQ must be 0 and PDF_RENDERER_NATIVE must be unset in this workflow"
            exit 1
          fi

      - name: Install the core test requirements
        run: |
          python -m pip install --disable-pip-version-check -r core/requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps bertopic==0.17.4

      - name: Install the production-pinned PDF browser
        run: python -m playwright install --with-deps --only-shell chromium

      # The guard is on PYTHONPATH for this step only: the install step above needs the network.
      - name: Run the core suite under the offline guard
        env:
          CORE_OFFLINE_GUARD_LOG: ${{ runner.temp }}/offline-guard.jsonl
          PYTHONPATH: ${{ github.workspace }}/tests_support/offline_guard
          F42_REQUIRE_OFFLINE_GUARD: "1"
        run: python tests_support/ci_core_shards.py run --root core --shard ${{ matrix.shard }} --count 4 --out "${RUNNER_TEMP}/core-shard"

      # A refusal the product code catches and carries on from leaves the suite green, so the log is checked here.
      - name: Fail on any offline guard refusal the tests did not ask for
        if: always()
        env:
          CORE_OFFLINE_GUARD_LOG: ${{ runner.temp }}/offline-guard.jsonl
        run: python tests_support/ci_guard_refusals.py "${CORE_OFFLINE_GUARD_LOG}"

      - name: Retain each shard receipt and exact JUnit identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/core-shard
          if-no-files-found: error

  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history, because a core test reads a file from origin/full-42 with git show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refuse a native opt-in run
        run: |
          if [ "${F42_BQ}" != "0" ] || [ -n "${PDF_RENDERER_NATIVE:-}" ]; then
            echo "F42_BQ must be 0 and PDF_RENDERER_NATIVE must be unset in this workflow"
            exit 1
          fi

      - name: Install the core test requirements
        run: |
          python -m pip install --disable-pip-version-check -r core/requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps bertopic==0.17.4

      # The ops partition: the tests of the two evidence tools that read core's SQL and views (the a80 replay and the
      # funnel scoreboard). Nothing else ran ops/tests, so a change in core that broke either tool went unseen. It runs
      # whether or not the core run passed, under the same guard and into the same guard log, which is checked below.
      # The replay's pin test reads a80be1d with git show, so it needs the full history fetched above.
      - name: Run the ops partition under the offline guard
        if: always()
        env:
          CORE_OFFLINE_GUARD_LOG: ${{ runner.temp }}/offline-guard.jsonl
          PYTHONPATH: ${{ github.workspace }}/tests_support/offline_guard
          F42_REQUIRE_OFFLINE_GUARD: "1"
        run: python -m pytest ops/tests/test_replay_a80.py ops/tests/test_funnel_scoreboard.py -q -p no:cacheprovider -ra --junitxml="${RUNNER_TEMP}/ops-junit.xml"

      # The ops partition has floors of its own. Its tests are in a separate JUnit file, so the core floors above cannot
      # see a loss there. Pinned a little under the 161 tests the partition collected and the 158 that passed under the
      # guard at the wave 8 integration, with a ratchet of 20 so the floor follows the partition up.
      - name: Report the ops tests that ran
        if: always()
        run: python tests_support/ci_skip_report.py "${RUNNER_TEMP}/ops-junit.xml" --min-total 158 --min-passed 155 --ratchet-gap 20 >> "${GITHUB_STEP_SUMMARY}"

      # A refusal the product code catches and carries on from leaves the suite green, so the log is checked here.
      - name: Fail on any offline guard refusal the tests did not ask for
        if: always()
        env:
          CORE_OFFLINE_GUARD_LOG: ${{ runner.temp }}/offline-guard.jsonl
        run: python tests_support/ci_guard_refusals.py "${CORE_OFFLINE_GUARD_LOG}"

  # Raised at the wave 8 integration; the same floors now judge exact merged node receipts.
  core_aggregate:
    needs: core
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Read all independent shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: core-shard-*
          path: ${{ runner.temp }}/core-shards
      - name: Reconcile every collected node before the existing floors
        if: always()
        run: python tests_support/ci_core_shards.py aggregate --artifacts "${RUNNER_TEMP}/core-shards" --count 4 --head "${GITHUB_SHA}" --junit "${RUNNER_TEMP}/core-junit.xml"
      - name: Report the skipped opt-in tests and the number of tests that ran
        if: always()
        run: python tests_support/ci_skip_report.py "${RUNNER_TEMP}/core-junit.xml" --min-total 28573 --min-passed 28573 --ratchet-gap 800 >> "${GITHUB_STEP_SUMMARY}"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the Python producer fixture requirements
        run: python -m pip install --disable-pip-version-check pytest==8.3.3 sqlglot==30.20.0 jsonschema==4.25.1

      - name: Install bun
        run: |
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/bun" bun@1.4.0
          echo "${RUNNER_TEMP}/bun/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install the frontend packages from the lock file
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      - name: Check the frontend fixture runtimes
        run: |
          python --version
          node --version
          bun --version
          google-chrome --version
          python -c "from core.agent.tests.test_remaining_lists import fixture, entity_lists, QUESTIONS; print('Python producer fixtures ready')"

      # The design token gate reads app/frontend/src and the baseline beside it, and nothing else. It prints one FAIL
      # line for each raw font size past the baseline, rounded corner or drop shadow, and exits 1 on any. The tree is
      # held at zero.
      - name: Hold the design token gate at zero
        working-directory: app/frontend
        run: node scripts/check_design_tokens.mjs

      # A local vite bundle into the gitignored app/web/dist, which neutral-contract.test.jsx reads. Nothing is
      # uploaded or published from it.
      - name: Build the bundle the frontend tests read
        working-directory: app/frontend
        run: bun run build

      - name: Run the frontend tests
        working-directory: app/frontend
        run: bun test
