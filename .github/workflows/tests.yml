# Test-only workflow for 42. It reads the repository and runs the tests. It signs in to nothing, holds no secret,
# builds only the local frontend bundle its tests read and ships nothing; the workflows that sign in, build images
# and deploy stay parked in .github/parked-workflows.
# core/eval/tests/harness/test_harness_ci_workflow.py fails if this file ever asks for more than that.
#
# Native opt-in tests (live BigQuery dry runs behind F42_BQ=1, the packaged Linux browser behind
# PDF_RENDERER_NATIVE=1) are never run here. They show as skipped, and the skip report lists them by count.
name: tests

on:
  pull_request:
  push:
    branches: [full-42, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  F42_BQ: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CORE_OFFLINE_GUARD_LOG: ${{ runner.temp }}/offline-guard.jsonl
    steps:
      # Full history, because a core test reads a file from origin/full-42 with git show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refuse a native opt-in run
        run: |
          if [ "${F42_BQ}" != "0" ] || [ -n "${PDF_RENDERER_NATIVE:-}" ]; then
            echo "F42_BQ must be 0 and PDF_RENDERER_NATIVE must be unset in this workflow"
            exit 1
          fi

      - name: Install the core test requirements
        run: |
          python -m pip install --disable-pip-version-check -r core/requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps bertopic==0.17.4

      # The guard is on PYTHONPATH for this step only: the install step above needs the network.
      - name: Run the core suite under the offline guard
        env:
          PYTHONPATH: ${{ github.workspace }}/tests_support/offline_guard
          F42_REQUIRE_OFFLINE_GUARD: "1"
        run: python -m pytest core -q -p no:cacheprovider -ra --junitxml="${RUNNER_TEMP}/core-junit.xml"

      # The floor is a little under the 17446 tests the core tree collected when it was pinned. A run that collects
      # fewer than that has lost a part of the tree, and the job fails even if everything it did run passed.
      - name: Report the skipped opt-in tests and the number of tests that ran
        if: always()
        run: python tests_support/ci_skip_report.py "${RUNNER_TEMP}/core-junit.xml" --min-total 17000 >> "${GITHUB_STEP_SUMMARY}"

      # A refusal the product code catches and carries on from leaves the suite green, so the log is checked here.
      - name: Fail on any offline guard refusal the tests did not ask for
        if: always()
        run: python tests_support/ci_guard_refusals.py "${CORE_OFFLINE_GUARD_LOG}"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        run: |
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/bun" bun@1.4.0
          echo "${RUNNER_TEMP}/bun/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install the frontend packages from the lock file
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      # A local vite bundle into the gitignored app/web/dist, which neutral-contract.test.jsx reads. Nothing is
      # uploaded or published from it.
      - name: Build the bundle the frontend tests read
        working-directory: app/frontend
        run: bun run build

      - name: Run the frontend tests
        working-directory: app/frontend
        run: bun test
