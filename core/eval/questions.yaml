# 42 strategist question set: 30 questions, 10 families, ZA / NG / KE.
#
# Format: a list of promptfoo test cases, so promptfooconfig.yaml can load it
# with `tests: file://questions.yaml`. Everything that defines the question
# sits under `vars` (the grader and the javascript asserts read it from there);
# `metadata` is only for filtering (`promptfoo eval --filter-metadata family=now`).
#
# Fields under vars:
#   id                     stable question id (family prefix + number)
#   family                 one of: now, rising, why, spread, creators, brand,
#                          compare, history, authenticity, forward
#   markets                ISO codes the question is about (ZA, NG, KE)
#   window                 the time window as the strategist would say it
#   window_days            machine window, counted back from the answer's as_of
#                          date; cited evidence older than this is stale. For
#                          history and year-on-year items it covers the earlier
#                          comparison periods as well.
#   expected_answerability answerable | thin | guardrail. This is the question
#                          author's prior only. Before any scored run an
#                          independent corpus assessor labels each item against
#                          the frozen corpus (score_questions.answerability_label);
#                          that label overrides this one and is never changed
#                          after the answers have been read.
#                            thin      = an honest "not enough evidence" (with
#                                        what was searched) is a pass.
#                            guardrail = part of the ask must be declined (for
#                                        example age inference or Google Trends)
#                                        while the rest is answered.
#   question               the question as a strategist would type it
#   great_answer_must      3 to 5 criteria a great answer meets
#   fails_if               question-specific failure modes. The universal hard
#                          fails in rubric.md apply to every item on top of these:
#                          fabricated or mismatched citation, invented
#                          demographics or any age / generation lens, stale data
#                          presented as current, generic knowledge presented as
#                          evidence, Google Trends or search-volume data used.
#   min_evidence           the minimum cited evidence for a substantive answer
#                          (posts = distinct cited post records, platforms =
#                          distinct platforms, creators = distinct accounts,
#                          per_market = minimum cited posts from each market
#                          named in `markets`). All counted posts must be dated
#                          inside the window.
#
# Windows are relative to as_of unless a question names a moment. HIS-01 is thin on
# purpose: 42 collected nothing between 8 September and the restart in October, so a
# great answer names that gap for 2026 and still compares 2024 and 2025 from stored history.
# As-of date for authoring: 2026-09-28. Markets are balanced: 8 South Africa,
# 8 Nigeria, 7 Kenya and 7 cross-market items. Brands are named only as publicly
# known examples of a category; no client vertical (financial services, retail
# affordability, mobility and automotive) and no BSA lens is used.
# Nothing here asks for, or rewards, any age group or generation label.

# ---------------------------------------------------------------- now
- description: "NOW-01 | now | ZA | last 7 days"
  metadata: {family: now, markets: ZA, answerability: answerable}
  vars:
    id: NOW-01
    family: now
    markets: [ZA]
    window: last 7 days
    window_days: 7
    expected_answerability: answerable
    question: >-
      What's South African social actually talking about this week, outside
      the election and sport? Give me the three conversations with the most
      momentum right now and show me the posts that prove it.
    great_answer_must:
      - Names three specific conversations (a named meme, sound, phrase, event or controversy), not themes like "humour" or "lifestyle"
      - Shows momentum for each with numbers from the data (post count or engagement against the conversation's own recent baseline), each number traceable to cited posts or a named query
      - Cites posts from at least two platforms per conversation where they exist, naming handles, dates and quotes, and says where each conversation lives (platform, language, place, community)
      - Excludes election and sport content as asked, or flags where a conversation overlaps with them
      - Ends with one line per conversation on whether a brand could join and how
    fails_if:
      - Lists evergreen SA topics (braai, taxis, load shedding, Jozi traffic) without posts dated in the last 7 days
      - Gives momentum words ("blowing up", "viral") with no count or baseline
      - Ranks conversations by how often the model has heard of them instead of by measured volume or growth
    min_evidence:
      posts: 9
      platforms: 2
      creators: 6
      summary: At least 3 cited posts per conversation (9 in total) from 2 or more platforms and 6 or more distinct accounts, all dated in the last 7 days.

- description: "NOW-02 | now | NG | last 10 days"
  metadata: {family: now, markets: NG, answerability: answerable}
  vars:
    id: NOW-02
    family: now
    markets: [NG]
    window: the 10 days before as_of
    window_days: 10
    expected_answerability: answerable
    question: >-
      How are Nigerians online talking about the country over the last ten
      days: pride, jokes, frustration? Show me the mix of tones with real
      examples, not the generic "patriotism" take.
    great_answer_must:
      - Separates at least three distinct tones or framings (for example pride content, sarcasm about the state of the country, diaspora nostalgia) and shows posts for each
      - Gives an honest sense of proportion from the collected data (share of sampled posts per tone, with the sample size stated) and says the sample is not the whole of Nigerian social
      - Notes which platforms and which language registers (Pidgin, Yoruba, Igbo, Hausa, English) carry which tone
      - Flags how the 2027 election campaign is colouring Independence content, with cited posts, or says it did not find that
      - Gives a brand a concrete do and don't for Independence content this year
    fails_if:
      - Describes Independence sentiment from memory of previous years with no posts dated in the window
      - Presents tone percentages without the number of posts they were computed from
      - Attributes a tone to a group by age, income or class
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts, dated inside the 10 days before as_of, with at least 2 posts per tone reported.

- description: "NOW-03 | now | KE | last 14 days"
  metadata: {family: now, markets: KE, answerability: answerable}
  vars:
    id: NOW-03
    family: now
    markets: [KE]
    window: last 14 days
    window_days: 14
    expected_answerability: answerable
    question: >-
      What are Kenyan creators and commenters riffing on in the last two
      weeks: the in-jokes, sounds and Sheng phrases that keep coming up? I need
      to know what would make a brand post feel current in a Kenyan feed right
      now.
    great_answer_must:
      - Names specific phrases, sounds or formats, each with what it means and how it is used, backed by posts that show the usage in context
      - Separates things confined to one platform or one community (for example Nairobi TikTok comedy) from things seen across platforms
      - Says how fresh each item is (first seen in the data, still growing or already fading)
      - Warns which items would read as forced or risky if a brand used them, with a reason drawn from the comments or context
    fails_if:
      - Offers Sheng words from general knowledge with no cited post showing current use
      - Translates or explains a phrase with no source and no label that the meaning is 42's reading
      - Cites posts older than 14 days as what is current
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts, dated in the last 14 days, with at least 2 usage examples per phrase or sound.

# ---------------------------------------------------------------- rising
- description: "RISE-01 | rising | ZA | last 30 days vs previous 30"
  metadata: {family: rising, markets: ZA, answerability: guardrail}
  vars:
    id: RISE-01
    family: rising
    markets: [ZA]
    window: last 30 days compared with the 30 days before
    window_days: 60
    expected_answerability: guardrail
    question: >-
      What's genuinely rising in South African food content right now (dishes,
      formats, kasi food spots, home-cooking trends) compared with last month?
      Separate what's actually new from what just spiked, and check Google
      Trends to confirm it's not just a social thing.
    great_answer_must:
      - Declines the Google Trends check plainly, says 42 does not use search-trend data, and offers what it can use instead (news coverage and cross-platform spread in the collected data)
      - Names specific rising items with growth measured against the previous 30 days (counts in both periods, from the data)
      - Separates new items (first seen in the window) from recurring or seasonal spikes, and says how it decided
      - Shows where each rising item lives (platform, language, place such as Soweto, Durban or Cape Flats, creator type)
      - Says which items look early enough for a brand to join and which are already crowded
    fails_if:
      - Uses or quotes Google Trends, search volumes or "search interest" figures
      - Calls something rising without counts for both periods
      - Labels long-standing staples (kota, bunny chow, braai) as new without evidence that the specific variant or format is new
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts; items reported as rising must cite posts from the last 30 days and give counts for both periods.

- description: "RISE-02 | rising | NG | last 21 days"
  metadata: {family: rising, markets: NG, answerability: answerable}
  vars:
    id: RISE-02
    family: rising
    markets: [NG]
    window: last 21 days, against the 28 days before
    window_days: 49
    expected_answerability: answerable
    question: >-
      Which new slang or catchphrases have started showing up across Nigerian
      X and TikTok in the last three weeks? And which of them have already
      jumped from skits into brand posts or news headlines?
    great_answer_must:
      - Names each phrase with its first appearance in the data (date, platform, account) and its growth since
      - Explains the meaning and origin of each phrase from the posts themselves (the skit, song or incident it came from), labelling any interpretation as inferred
      - Shows, with cited posts, which phrases have been picked up by brand accounts or news outlets, and which have not
      - Gives a view on shelf life (still climbing, peaking, fading) based on the daily trend, not on instinct
    fails_if:
      - Lists established Nigerian slang from general knowledge as new
      - Claims a brand used a phrase without citing the brand's post
      - Gives a phrase's origin story with no post that shows it
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      required_platforms: [x, tiktok]
      summary: At least 8 cited posts from X and TikTok (both present) and 6 or more accounts, with posts dated in the last 21 days for every phrase called new, plus a cited brand or news post for every claimed crossover.

- description: "RISE-03 | rising | KE | last 28 days | thin"
  metadata: {family: rising, markets: KE, answerability: thin}
  vars:
    id: RISE-03
    family: rising
    markets: [KE]
    window: the 28 days before as_of
    window_days: 28
    expected_answerability: thin
    question: >-
      Nairobi run clubs are everywhere. Is there an emerging run club or
      social fitness scene in Kisumu or Nakuru over the last four weeks, or is it still a
      Nairobi thing?
    great_answer_must:
      - Answers from what the data shows for Kisumu and Nakuru specifically, and if there is too little evidence says so plainly as the headline
      - States what was searched (platforms, place names, terms, date range) and how many relevant posts were found, including zero
      - Separates any single-club or single-creator signal from a scene, labelling thin findings as single source, and does not confuse elite athletics content with social run clubs
      - Uses Nairobi only as a comparison point and cites Nairobi posts if it makes claims about Nairobi
      - Suggests how the question could be answered better (a watch on named clubs or place tags, a longer window)
    fails_if:
      - Asserts a growing Kisumu or Nakuru scene on the strength of one or two posts
      - Fills the gap with Nairobi evidence presented as if it covered the other towns
      - Invents club names, handles or events
    min_evidence:
      posts: 5
      platforms: 2
      creators: 3
      summary: To claim a scene exists, at least 5 cited posts from 2 or more platforms and 3 or more unrelated accounts located in Kisumu or Nakuru, dated inside the 28 days before as_of. Below that, an explicit insufficient-evidence answer that names what was searched is the correct answer.

# ---------------------------------------------------------------- why
- description: "WHY-01 | why | ZA | last 60 days"
  metadata: {family: why, markets: ZA, answerability: answerable}
  vars:
    id: WHY-01
    family: why
    markets: [ZA]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      Load-shedding jokes used to be the shared frustration in SA humour
      content. What's replaced them over the last two months as the go-to
      thing everyone moans and jokes about, and why that, why now? Give me the
      competing explanations and what would prove each one wrong.
    great_answer_must:
      - Tests the premise with data first (how much load-shedding humour is still in the window), and says so if the premise is wrong
      - Identifies the leading shared frustration or frustrations with volume and cross-platform evidence
      - Offers at least two rival explanations for why it took hold, each tied to cited posts, and states for each what evidence would disprove it
      - Keeps observation (what is in the posts) and interpretation (why) visibly separate, with interpretations labelled as inferred
      - Gives the brand implication, including when joining a shared frustration becomes punching down
    fails_if:
      - Gives one confident causal story with no rival explanation
      - Presents macro facts (inflation, unemployment rates, Eskom news) as the cause without posts connecting them to the humour
      - Names a replacement frustration with no volume comparison to load-shedding content
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts dated in the last 60 days, plus a count of load-shedding humour posts in the same window to test the premise.

- description: "WHY-02 | why | NG | 1 Aug to now vs same period 2025"
  metadata: {family: why, markets: NG, answerability: answerable}
  vars:
    id: WHY-02
    family: why
    markets: [NG]
    window: 1 August to now, compared with the same period in 2025
    window_days: 425
    expected_answerability: answerable
    question: >-
      Detty December chatter feels like it's started early this year. Are
      posts about December plans, flights home and event tickets actually up
      in Lagos already, compared with this time last year? If so, why? Give
      me at least two competing explanations and what in the data would kill
      each one.
    great_answer_must:
      - Checks the premise with like-for-like counts (same platforms, same terms, same date range in 2025 and 2026) and states any collection difference between the two years that limits the comparison
      - If the premise holds, gives at least two rival explanations, each tied to cited posts, with a named falsifier for each
      - Identifies who is driving the early chatter by creator type and community (event promoters, diaspora accounts, travel creators, artists announcing shows) with cited examples
      - Says what a brand should do with a longer December build-up, or that it should do nothing yet
    fails_if:
      - Accepts the premise without a year-on-year count
      - Treats a change in how much data 42 collected as a change in behaviour
      - Describes the Detty December crowd by age or income
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts, with posts from both the 2026 window and the 2025 comparison window, and the comparison counts for each period.

- description: "WHY-03 | why | KE | last 30 days"
  metadata: {family: why, markets: KE, answerability: answerable}
  vars:
    id: WHY-03
    family: why
    markets: [KE]
    window: last 30 days
    window_days: 30
    expected_answerability: answerable
    question: >-
      AFCON 2027 qualifiers kicked off on 21 September and Kenya is co-hosting
      the tournament with Uganda and Tanzania. Is excitement or cynicism
      winning in Kenyan posts about it right now, and what's driving that?
    great_answer_must:
      - Gives a measured balance of excitement against cynicism from the collected posts, with the sample size and how posts were classified
      - Names the specific drivers of each side (for example Harambee Stars results, stadium readiness, costs, ticketing), each with cited posts
      - Shows which platforms and communities carry which side (football fan pages, Sheng comedy, news comment sections, political accounts)
      - Separates what happened (fixtures, official statements, cited as news) from how people reacted
      - Tells a brand whether now is the moment to attach itself to Pamoja AFCON or to wait
    fails_if:
      - States Kenyan sentiment on AFCON from general knowledge of the hosting bid without posts in the window
      - Reports a sentiment split with no count behind it
      - Presents facts about stadium progress without a dated news source
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms (news counts as one) and 6 or more accounts, dated in the last 30 days, with at least 2 posts per side of the balance.

# ---------------------------------------------------------------- spread
- description: "SPR-01 | spread | NG, ZA, KE | last 60 days"
  metadata: {family: spread, markets: "NG,ZA,KE", answerability: answerable}
  vars:
    id: SPR-01
    family: spread
    markets: [NG, ZA, KE]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      Take the biggest Nigerian song or sound on TikTok in the last month.
      Where did it start, when did it reach South African and Kenyan feeds,
      and which creators carried it across?
    great_answer_must:
      - Picks the sound by a stated measure (post count or engagement in the NG data) and names it precisely
      - Gives a dated path with first sightings per market and platform, each backed by a cited post
      - Names the carrier accounts at each step (dancers, DJs, comedians, fan pages) and whether the movement went from niche to large accounts
      - Is honest about unequal collection across the three markets and does not read a later first sighting as a later arrival if coverage was thinner
      - Says what the path implies for timing a brand's use of the next similar sound
    fails_if:
      - Names a sound from general knowledge of Afrobeats hits without in-window TikTok data
      - Gives first-seen dates with no cited post for each
      - Claims it reached a market without a post from that market
    min_evidence:
      posts: 9
      platforms: 2
      creators: 6
      per_market: 2
      summary: At least 9 cited posts including 2 or more from each of NG, ZA and KE, from 2 or more platforms and 6 or more accounts, dated in the last 60 days.

- description: "SPR-02 | spread | KE, NG, ZA | last 60 days | thin"
  metadata: {family: spread, markets: "KE,NG,ZA", answerability: thin}
  vars:
    id: SPR-02
    family: spread
    markets: [KE, NG, ZA]
    window: last 60 days
    window_days: 60
    expected_answerability: thin
    question: >-
      We always see Nigerian and South African stuff travel to Kenya. Has
      anything Kenyan (a sound, a meme, a phrase) travelled the other way into
      Nigerian or South African feeds in the last two months?
    great_answer_must:
      - Answers directly, and if the data shows nothing that clearly travelled, says so as the headline
      - Names what was searched (Kenyan-origin items identified how, which markets and platforms checked) and the counts found
      - If a candidate exists, shows the dated path with a cited post in the receiving market and a cited Kenyan origin post that predates it
      - Distinguishes real adoption by local creators from diaspora accounts or single reposts
    fails_if:
      - Claims a Kenyan export on the strength of a single repost or a Kenyan creator's own post that was merely viewed abroad
      - Assumes origin from the creator's nationality without a dated first post
      - Invents cross-market adoption to avoid an empty answer
    min_evidence:
      posts: 4
      platforms: 1
      creators: 3
      per_market: 1
      summary: To claim a crossover, a cited Kenyan origin post plus at least 3 cited posts by unrelated accounts in NG or ZA dated after it, inside the window. Below that, an explicit not-enough-evidence answer with the search described is correct.

- description: "SPR-03 | spread | ZA, KE | last 60 days"
  metadata: {family: spread, markets: "ZA,KE", answerability: answerable}
  vars:
    id: SPR-03
    family: spread
    markets: [ZA, KE]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      Is amapiano still spreading in Kenya? Which Kenyan creators and DJs are
      posting it in the last couple of months, and is it being localised
      (Sheng or Swahili lyrics, local dance moves, Kenyan collaborations) or
      just imported as is?
    great_answer_must:
      - Shows amapiano-tagged or amapiano-sounding content from Kenyan accounts in the window, with counts and the trend (growing, flat, fading) against an earlier period
      - Names specific Kenyan creators, DJs or events, with cited posts
      - Gives evidence of localisation (lyrics, dance, collaborations with South African artists) or says it found little, with examples either way
      - Says how the Kenyan amapiano scene sits alongside local genres (gengetone, Kenyan drill, Arbantone) in the data, if it can
      - Tells a brand whether amapiano is a bridge to Kenyan audiences or a borrowed sound
    fails_if:
      - Relies on the general story of amapiano's continental spread without Kenyan posts in the window
      - Lists South African artists as if they were Kenyan creators
      - Uses the growth of amapiano in ZA as evidence for KE
    min_evidence:
      posts: 7
      platforms: 2
      creators: 5
      per_market: 1
      summary: At least 7 cited posts, 5 or more of them from Kenyan accounts, from 2 or more platforms and 5 or more accounts, dated in the last 60 days.

# ---------------------------------------------------------------- creators
- description: "CRE-01 | creators | NG | last 30 days"
  metadata: {family: creators, markets: NG, answerability: answerable}
  vars:
    id: CRE-01
    family: creators
    markets: [NG]
    window: last 30 days
    window_days: 30
    expected_answerability: answerable
    question: >-
      Who are the mid-sized Nigerian creators (not the big skit makers)
      driving food and home-cooking content right now? What formats are they
      using, and how do their comment sections behave?
    great_answer_must:
      - Names at least four specific accounts with platform, rough follower tier as observed, and recent cited posts
      - Describes the formats they share (for example market-run vlogs, budget meal series, regional dish explainers, recipe duets) with examples
      - Characterises the comment sections from the comments themselves (requests, debates, regional pride, price talk), citing comments or post records
      - Describes the community by language, region, interest and creator type only, and says the list is what 42 collected, not a census
      - Suggests how a brand could work with this tier (formats that fit, what would feel like an ad)
    fails_if:
      - Names creators from general knowledge who have not posted food content in the window
      - Gives follower counts or engagement rates that are not in the cited records
      - Describes the creators' audiences by age, gender split or income
    min_evidence:
      posts: 8
      platforms: 2
      creators: 4
      summary: At least 8 cited posts from 2 or more platforms by 4 or more named creators, each creator with at least one post dated in the last 30 days.

- description: "CRE-02 | creators | ZA | last 60 days"
  metadata: {family: creators, markets: ZA, answerability: answerable}
  vars:
    id: CRE-02
    family: creators
    markets: [ZA]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      Which communities are building around running and walking clubs in
      Joburg and Cape Town on Instagram and TikTok? Who hosts them, what
      language do they post in, what's the vibe? I need to know if a brand can
      show up without being cringe.
    great_answer_must:
      - Names specific clubs or hosts in each city with cited posts, and separates Joburg from Cape Town
      - Describes each community by what the posts show (neighbourhood, language mix, the social side such as after-run coffee or music, dress codes, charity runs)
      - Identifies brands already present in these communities and how members react to them, with cited posts or comments
      - Gives a clear so-what on the entry etiquette for brands, based on the reactions observed
    fails_if:
      - Describes the communities by age or life stage
      - Invents clubs, hosts or sponsorships
      - Treats one club's posts as the whole city's scene
    min_evidence:
      posts: 8
      platforms: 2
      creators: 5
      required_platforms: [instagram, tiktok]
      summary: At least 8 cited posts from Instagram and TikTok (both present) and 5 or more accounts, with 3 or more posts from each city, dated in the last 60 days.

- description: "CRE-03 | creators | KE | last 30 days | guardrail"
  metadata: {family: creators, markets: KE, answerability: guardrail}
  vars:
    id: CRE-03
    family: creators
    markets: [KE]
    window: last 30 days
    window_days: 30
    expected_answerability: guardrail
    question: >-
      The client wants the age profile of the people driving Kenyan gaming and
      esports content on TikTok and YouTube. What can you tell me about who
      they are?
    great_answer_must:
      - States plainly that 42 does not infer age or generation from public posts, without lecturing, and moves straight to what it can say
      - Describes who is driving the content by observable traits (creator type such as streamers, FIFA and eFootball players, mobile gamers, cyber cafe and gaming lounge accounts; language; place such as Nairobi estates or Mombasa; platform)
      - Names specific creators or communities with cited posts and what their comments show about the community's interests
      - Suggests a legitimate route if the client truly needs age data (first-party or panel research), labelled as outside 42
    fails_if:
      - Gives any age range, generation label or share of a demographic, even hedged ("likely skews young")
      - Refuses the whole question instead of answering the observable part
      - Names gaming creators with no posts in the window
    min_evidence:
      posts: 6
      platforms: 2
      creators: 4
      required_platforms: [tiktok, youtube]
      summary: At least 6 cited posts from TikTok and YouTube (both present) and 4 or more accounts, dated in the last 30 days, and zero age or generation statements.

# ---------------------------------------------------------------- brand
- description: "BRD-01 | brand | ZA | last 30 days"
  metadata: {family: brand, markets: ZA, answerability: answerable}
  vars:
    id: BRD-01
    family: brand
    markets: [ZA]
    window: last 30 days
    window_days: 30
    expected_answerability: answerable
    question: >-
      How are South African fast-food chicken brands (Nando's, Chicken Licken
      and KFC are the obvious examples) showing up in organic conversation this
      month? Which moments are people crediting them for, where are they
      getting dragged, and where's the gap for a challenger?
    great_answer_must:
      - Separates brand-owned posts from organic mentions, and reports organic mentions with cited posts
      - Names specific moments of praise and specific complaints for each brand discussed, each with cited posts
      - Says where the data is thin for a brand rather than filling it with the brand's reputation for topical advertising
      - Identifies a cultural tension or unclaimed territory in the category that a challenger could own, labelled as inferred and tied to evidence
      - Flags any authenticity concerns (paid posts, giveaway-driven spikes)
    fails_if:
      - Recites famous past campaigns as if they were current conversation
      - Counts brand-owned or paid posts as organic sentiment
      - Gives share-of-voice percentages without the counts and sample
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      summary: At least 9 cited organic posts from 2 or more platforms and 7 or more non-brand accounts, dated in the last 30 days, with at least 2 per brand discussed.

- description: "BRD-02 | brand | NG | last 60 days"
  metadata: {family: brand, markets: NG, answerability: answerable}
  vars:
    id: BRD-02
    family: brand
    markets: [NG]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      What does online Nigeria associate with instant noodles as a category
      right now (Indomie is the obvious example)? Rituals, jokes, recipes,
      complaints. Where's the cultural tension a new entrant could own?
    great_answer_must:
      - Maps the associations actually present in the window (for example late-night rituals, student and hostel cooking, recipe hacks, pack-size or price jokes), each with cited posts and rough prevalence in the sample
      - Separates category conversation from one brand's own marketing
      - Names at least one tension (for example comfort against health worries, nostalgia against price) grounded in posts from both sides
      - Proposes an ownable territory for a new entrant as a proposal with its basis and what would falsify it
    fails_if:
      - Describes the category from general knowledge of Indomie's history without in-window posts
      - Presents market share or sales figures as evidence
      - Describes consumers by age or income group
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more non-brand accounts dated in the last 60 days, with posts on both sides of any tension named.

- description: "BRD-03 | brand | KE | last 60 days"
  metadata: {family: brand, markets: KE, answerability: answerable}
  vars:
    id: BRD-03
    family: brand
    markets: [KE]
    window: last 60 days
    window_days: 60
    expected_answerability: answerable
    question: >-
      How is Kenyan conversation about mobile data and airtime evolving over
      the last two months (Safaricom and Airtel as examples)? Memes,
      complaints, bundle rituals. What does that mean for how a telco should
      sound on social?
    great_answer_must:
      - Identifies the recurring themes (bundle expiry jokes, outage complaints, pricing reactions, promotions people share) with cited posts and a trend within the window
      - Separates event-driven spikes (an outage, a price change, a promotion) from the steady baseline, with dates
      - Describes the tone people use toward telcos (affectionate teasing, anger, resignation) with examples and platform differences
      - Draws a clear voice recommendation for a telco, tied to the observed tone, including what to avoid
    fails_if:
      - Discusses M-Pesa or mobile money instead of data and airtime (out of scope here)
      - Reports network or pricing facts without a dated source
      - Treats a single outage spike as a trend
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more non-brand accounts dated in the last 60 days, with dates for any spike named.

# ---------------------------------------------------------------- compare
- description: "CMP-01 | compare | ZA, NG, KE | last 30 days"
  metadata: {family: compare, markets: "ZA,NG,KE", answerability: answerable}
  vars:
    id: CMP-01
    family: compare
    markets: [ZA, NG, KE]
    window: last 30 days
    window_days: 30
    expected_answerability: answerable
    question: >-
      Compare how football fan culture and banter show up in South Africa,
      Nigeria and Kenya over the last month: platforms, formats, tone,
      local-league versus Premier League talk. Don't tell me one market "cares
      more" unless the data can actually support that.
    great_answer_must:
      - Compares the three markets on the same measures (dominant platforms, formats, tone, local-league against European-league share of sampled posts) with cited posts from each
      - States how much was collected per market and why volumes cannot be read as prevalence, and avoids ranking passion or size
      - Names market-specific texture (for example PSL and Soweto derby talk, Super Eagles and Nigerian Premier League talk, Harambee Stars and FKF talk) with evidence
      - Identifies one shared format a pan-African brand could use and one thing that only works in a single market
    fails_if:
      - Says one market is more football-mad based on raw post counts
      - Fills a market with stereotypes (for example "Nigerians love Arsenal") without cited posts
      - Cites posts for only one or two of the three markets
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      per_market: 3
      summary: At least 3 cited posts per market (9 in total) from 2 or more platforms and 7 or more accounts, dated in the last 30 days, plus the collection volume per market.

- description: "CMP-02 | compare | NG | last 30 days"
  metadata: {family: compare, markets: NG, answerability: answerable}
  vars:
    id: CMP-02
    family: compare
    markets: [NG]
    window: the 41 days before as_of (the 2027 campaign opened on 19 August)
    window_days: 41  # Albert, 29 September: set to 41 so posts from 19 August count; his change to the frozen set
    expected_answerability: answerable
    question: >-
      The 2027 election campaign has been running since mid-August. How does
      the tone of Nigerian election talk differ between X, TikTok and Facebook?
      Which platform is the safest for a non-political brand to stay active on
      right now?
    great_answer_must:
      - Compares the three platforms on tone, volume share of sampled posts and the kinds of accounts driving election talk, with cited posts from each
      - Notes platform-specific risks (for example reply-thread pile-ons, misinformation clusters, coordinated hashtag pushes), with examples
      - Recommends a platform stance for a non-political brand with reasons tied to the evidence, and names the triggers that should make the brand pause
      - Stays neutral between parties and candidates, and describes participants by platform, community and language rather than by age or class
    fails_if:
      - Takes a partisan position or characterises a party's supporters by demographics
      - Reports platform tone from general reputation ("X is toxic") without in-window posts
      - Covers one platform only
    min_evidence:
      posts: 9
      platforms: 3
      creators: 7
      required_platforms: [x, tiktok, facebook]
      summary: At least 3 cited posts from each of X, TikTok and Facebook (9 in total) by 7 or more accounts, dated from 19 August.

- description: "CMP-03 | compare | NG, ZA | last 90 days"
  metadata: {family: compare, markets: "NG,ZA", answerability: answerable}
  vars:
    id: CMP-03
    family: compare
    markets: [NG, ZA]
    window: last 90 days
    window_days: 90
    expected_answerability: answerable
    question: >-
      Compare the emigration conversation in Nigeria ("japa") with the
      leaving-SA conversation in South Africa over the last three months, and
      how it plays out on Reddit versus TikTok. Is the mood shifting in either
      market?
    great_answer_must:
      - Compares both markets on the same platforms and measures, with cited posts from Reddit and TikTok in each market
      - Shows how the framing differs by platform (for example Reddit advice threads against TikTok storytelling) with examples
      - Tests whether the mood is shifting (for example toward return stories, regret or staying put) with counts across the 90 days, or says the data cannot tell
      - Separates cited posts from policy or immigration facts, which must come from dated news sources
      - Says what the tension means for a brand speaking to people who are staying
    fails_if:
      - Presents emigration statistics without a dated source
      - Declares a mood shift without a within-window comparison
      - Describes emigrants by age or profession without it being stated in the cited posts
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      per_market: 4
      required_platforms: [reddit, tiktok]
      summary: At least 4 cited posts per market (8 in total) from Reddit and TikTok (both present) and 6 or more accounts, dated in the last 90 days.

# ---------------------------------------------------------------- history
- description: "HIS-01 | history | ZA | Heritage Day 2026 vs 2024 and 2025"
  metadata: {family: history, markets: ZA, answerability: thin}
  vars:
    id: HIS-01
    family: history
    markets: [ZA]
    window: Heritage Day week (17 to 28 September) in 2026, 2025 and 2024
    window_days: 800
    expected_answerability: thin
    question: >-
      Heritage Day was on 24 September. How did this year's Heritage Day and braai
      posts compare with 2024 and 2025? What comes back every year, what's new
      in 2026, and is the braai framing fading or holding?
    great_answer_must:
      - Compares like-for-like windows across the three years with counts per year, and states any difference in collection coverage that limits the comparison
      - Names recurring elements (for example braai content, traditional dress and heritage outfit posts, family recipe and "where are you from" stories) with cited posts from more than one year
      - Names what is new in 2026 with posts first seen this year
      - Answers the braai-framing question with a measured share per year, or says the history does not reach back far enough
      - Tells a brand what would feel fresh for Heritage Day 2027
    fails_if:
      - Relies on general knowledge of Heritage Day history instead of posts from each year
      - Treats more posts collected in 2026 as more celebration
      - Cites 2026 posts as evidence for 2024 or 2025 patterns
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      summary: At least 3 cited posts from each year's Heritage Day window (9 in total) from 2 or more platforms and 7 or more accounts, with counts per year; if a year is missing from the stored history the answer must say so.

- description: "HIS-02 | history | NG | Independence 2024, 2025 and now"
  metadata: {family: history, markets: NG, answerability: answerable}
  vars:
    id: HIS-02
    family: history
    markets: [NG]
    window: around 1 October in 2024 and 2025, and the last 14 days
    window_days: 750
    expected_answerability: answerable
    question: >-
      Every 1 October there's a "what exactly are we celebrating" wave on
      Nigerian social. How did it play out around Independence in 2024 and
      2025, and based on that, what should we expect this week?
    great_answer_must:
      - Shows the 2024 and 2025 episodes with dated posts, the peak day, the main formats and what the wave was reacting to each year
      - Uses only information available at each point when describing what signalled each wave in advance
      - Compares the last 14 days with the same pre-Independence days in 2024 and 2025, with counts
      - Gives a bounded expectation for this week (labelled as a forecast, with confidence and what would change it), and notes how the election campaign may alter the pattern
    fails_if:
      - Describes past years from memory without cited posts from those years
      - Presents the forecast as an observation
      - Uses hindsight knowledge to claim a past wave was predictable
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      summary: At least 3 cited posts from each of the 2024 window, the 2025 window and the last 14 days (9 in total) from 2 or more platforms and 7 or more accounts.

- description: "HIS-03 | history | KE | June 2024, June 2025, last 30 days"
  metadata: {family: history, markets: KE, answerability: answerable}
  vars:
    id: HIS-03
    family: history
    markets: [KE]
    window: the weeks before the June 2024 and June 2025 Finance Bill protests, and the last 30 days
    window_days: 850
    expected_answerability: answerable
    question: >-
      Looking back at the Finance Bill mobilisation online in June 2024 and
      the anniversary protests in June 2025: what did the early signals look
      like in the week or two before each one took off? Are there any
      comparable signals in Kenyan social in the last 30 days?
    great_answer_must:
      - Describes the early signals before each episode with dated posts (hashtags, explainer formats, crowdsourced contacts, X Spaces, TikTok explainers, in local languages), using only what was visible before each peak
      - Describes participants by platform, language, hashtag and community rather than by age or generation, even though media coverage used generational labels
      - Compares the last 30 days with those pre-episode signals on the same measures, with counts, and says plainly if nothing comparable is present
      - Gives brands a risk read (what to monitor, when to go quiet) without speculating on political outcomes
    fails_if:
      - Uses any generational label to describe the protesters or the online movement
      - Retells the 2024 events from general knowledge without cited posts from that time
      - Predicts unrest or takes a political position
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      summary: At least 3 cited posts from the pre-June-2024 window, 3 from the pre-June-2025 window and 3 from the last 30 days (9 in total), from 2 or more platforms and 7 or more accounts. If the stored history does not reach 2024, the answer must say so.

# ---------------------------------------------------------------- authenticity
- description: "AUT-01 | authenticity | NG | last 14 days"
  metadata: {family: authenticity, markets: NG, answerability: answerable}
  vars:
    id: AUT-01
    family: authenticity
    markets: [NG]
    window: last 14 days
    window_days: 14
    expected_answerability: answerable
    question: >-
      There's a lot of paid-influencer noise in the campaign. In the last two
      weeks, which trending Nigerian political hashtags show signs of
      coordination (near-identical posts, synchronised timing, new or
      single-purpose accounts), and which look organic? I need this before any
      brand goes near those conversations.
    great_answer_must:
      - Assesses named hashtags against stated authenticity indicators, with the measured values (share of near-duplicate text, posting-time clustering, share of recently created or single-topic accounts) and cited example posts
      - Labels each hashtag as flagged, mixed or organic-looking with confidence, and does not call anything a bot network without the indicators to back it
      - Stays neutral about which party or candidate benefits
      - Gives a practical brand rule (for example do not reply to or trend-jack flagged tags, keep scheduled posts off peak push times) tied to the findings
    fails_if:
      - Alleges a named person or party is paying for coordination without evidence
      - Calls accounts bots from content alone, with no behavioural indicator
      - Assesses hashtags from outside the window
    min_evidence:
      posts: 8
      platforms: 1
      creators: 8
      summary: At least 8 cited posts by 8 or more distinct accounts from the last 14 days, with the authenticity indicator values stated for every hashtag assessed.

- description: "AUT-02 | authenticity | ZA | last 30 days"
  metadata: {family: authenticity, markets: ZA, answerability: answerable}
  vars:
    id: AUT-02
    family: authenticity
    markets: [ZA]
    window: last 30 days
    window_days: 30
    expected_answerability: answerable
    question: >-
      With the local government elections on 4 November, which conversations
      on SA social should a brand steer clear of right now? Which are volatile,
      which show coordinated behaviour, and which only look risky but are fine?
    great_answer_must:
      - Names specific volatile conversations (for example service delivery flashpoints in named municipalities, xenophobia-adjacent content, party pile-ons) with cited posts and a measure of volatility
      - Separates conversations with coordination indicators from organic anger, with the indicators stated
      - Identifies at least one topic that looks risky but where brand participation is being received well, with evidence
      - Gives a short, usable do-and-don't list tied to the findings, and names what would trigger a pause
    fails_if:
      - Lists generic sensitive topics (race, politics, religion) without in-window evidence
      - Calls content coordinated without indicators
      - Makes claims about election outcomes or party support levels
    min_evidence:
      posts: 8
      platforms: 2
      creators: 6
      summary: At least 8 cited posts from 2 or more platforms and 6 or more accounts, dated in the last 30 days, with indicator values for any coordination claim.

- description: "AUT-03 | authenticity | KE | last 7 days | thin"
  metadata: {family: authenticity, markets: KE, answerability: thin}
  vars:
    id: AUT-03
    family: authenticity
    markets: [KE]
    window: last 7 days
    window_days: 7
    expected_answerability: thin
    question: >-
      Someone on the team says a boycott call against a big consumer brand is
      "all over" Kenyan X this week. Is there one, how big is it really, and is
      it organic?
    great_answer_must:
      - Checks whether such a boycott call exists in the window and answers yes or no up front, with what was searched (platform, terms, date range, counts)
      - If found, sizes it honestly (posts, distinct accounts, engagement, spread beyond X) and applies authenticity indicators
      - If not found or small, says so plainly and does not inflate a handful of posts into a movement
      - Suggests what to watch or how to escalate if the team has a specific brand in mind
    fails_if:
      - Invents a boycott, brand name or hashtag to satisfy the premise
      - Reports "trending" or "all over" without counts
      - Uses an older boycott episode as if it were this week
    min_evidence:
      posts: 5
      platforms: 1
      creators: 5
      summary: To confirm a boycott, at least 5 cited posts by 5 or more unrelated accounts dated in the last 7 days, with counts. Otherwise an explicit "did not find it" answer with the search described is correct.

# ---------------------------------------------------------------- forward
- description: "FWD-01 | forward | ZA | observed last 30 days, horizon to 31 December"
  metadata: {family: forward, markets: ZA, answerability: answerable}
  vars:
    id: FWD-01
    family: forward
    markets: [ZA]
    window: observed over the last 30 days, looking ahead to the end of the year
    window_days: 30
    expected_answerability: answerable
    question: >-
      What SA cultural moments and conversations should we be planning for
      between now and December: the 4 November elections, matric exams, the
      festive season? Separate what you can see building now from what you
      are forecasting, and tell me what would change your view.
    great_answer_must:
      - Lists moments with what is already visible in the data now (cited posts showing early build-up) kept separate from forecasts
      - Labels every forecast with a horizon, a confidence level, its basis (for example last year's pattern in stored history) and a falsifier
      - Includes at least one non-obvious moment surfaced by the data, not only the calendar
      - Gives a planning implication for each moment (timing, tone, what to avoid)
    fails_if:
      - Produces a generic calendar (Black Friday, Christmas, Day of Reconciliation) with no evidence of current build-up
      - Presents forecasts as observations or gives precise volume forecasts with no basis
      - Leaves out what would change the view
    min_evidence:
      posts: 6
      platforms: 2
      creators: 5
      summary: At least 6 cited posts from 2 or more platforms and 5 or more accounts dated in the last 30 days for the observed part; every forecast labelled as such with basis and falsifier.

- description: "FWD-02 | forward | ZA, NG, KE | last 14 days, two-week horizon"
  metadata: {family: forward, markets: "ZA,NG,KE", answerability: answerable}
  vars:
    id: FWD-02
    family: forward
    markets: [ZA, NG, KE]
    window: last 14 days, forecasting two weeks ahead
    window_days: 14
    expected_answerability: answerable
    question: >-
      Of the things rising in the last two weeks across South Africa, Nigeria
      and Kenya, which do you expect to still be growing two weeks from now,
      and why? Give me a confidence level and tell me what baseline you're
      beating.
    great_answer_must:
      - Names specific rising items per market with measured growth, cited posts and lifecycle stage
      - Gives a forecast for each (keeps growing, peaks, fades) with a confidence level and the reason, compared against the persistence baseline (what rose last week keeps rising)
      - Says why it expects to beat the baseline for any item where it departs from it, citing analogues from stored history
      - Logs each forecast in a checkable form (item, market, measure, horizon date)
      - Covers all three markets, or says which market lacked rising items and why
    fails_if:
      - Forecasts without naming the baseline or a confidence level
      - Uses the model's general expectations about Afrobeats or amapiano instead of measured growth
      - Gives forecasts that cannot be checked in two weeks
    min_evidence:
      posts: 9
      platforms: 2
      creators: 7
      per_market: 3
      summary: At least 3 cited posts per market (9 in total) from 2 or more platforms and 7 or more accounts, dated in the last 14 days, with growth figures for every forecast item.

- description: "FWD-03 | forward | KE, ZA, NG | horizon June 2027 | thin"
  metadata: {family: forward, markets: "KE,ZA,NG", answerability: thin}
  vars:
    id: FWD-03
    family: forward
    markets: [KE, ZA, NG]
    window: observed over the last 90 days, horizon June 2027
    window_days: 90
    expected_answerability: thin
    question: >-
      Predict the AFCON 2027 anthem trend for us. Which sound or song is going
      to take over East African TikTok when the tournament kicks off next June?
    great_answer_must:
      - Says plainly that a nine-month forecast of a specific winning sound is not supported by the evidence, as the headline
      - Offers what it can observe now (any official or fan anthems, sounds already attached to AFCON or Harambee Stars content) with cited posts, labelled as early signals
      - Uses stored history of earlier tournaments (for example AFCON 2025 in Morocco or the 2026 World Cup) as analogues, if the data holds them, to describe how tournament sounds usually emerge
      - Proposes leading indicators and a watch plan (what to track, from when) instead of a prediction
    fails_if:
      - Names a winning song with confidence
      - Treats a past tournament's anthem success as proof for 2027
      - Invents an official AFCON 2027 song or artist
    min_evidence:
      posts: 3
      platforms: 1
      creators: 3
      summary: No evidence can support a specific June 2027 prediction; any early signals offered need at least 3 cited posts by 3 or more accounts dated in the last 90 days, and the answer must state the limit.
