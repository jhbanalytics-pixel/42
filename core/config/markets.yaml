# Market config for the Stage 1A collect job (task 1.3, SOURCES.md costed
# rows 1 to 8, 11, 12, 14, 16, 22). Lifted in task 0.7 from engine/configs.
# Every list names the file and key it came from. Nothing here was added by
# hand beyond the lift; terms tied to a life stage or schooling, client brand
# lens tags and every retired trend-search source were left behind.
# Topic groups and slang lists are not lifted: 42 scores candidates with no
# slang or audience weight (SOURCES.md, the morning seed loop).
# Audiences are described by language, place, interest, community and
# creator type only.

