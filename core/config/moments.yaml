# Moments calendar hand list for task 1.4 (docs/full-42/BUILD.md row 1.4).
# core/collect/calendar.py reads this file together with the date.nager.at
# public holidays and MERGEs the rows into intelligence_42_core.calendar.
#
# A moment is loaded only with a date from date.nager.at, a date stated in
# docs/full-42, or a stated calendar rule, and the rule text is its source.
# Everything else sits under pending with what is missing and is never loaded.
#
# Markets are the country codes in core/config/markets.yaml.
# Kinds: holiday, payday, fuel, election, culture, commerce, season, results, sport.

# Rows run from the load date to 90 days later, or to this date if later.
known_until: 2027-01-31

# Hand list moments that date.nager.at already dates. The nager row takes the
# hand list name and kind, and the docs reference joins its source.
nager_renames:
  - market: NG
    nager_name: National Day
    name: Independence Day
    kind: holiday
    source: docs/full-42/BUILD.md task 1.4 (NG Independence Day 1 October)
  - market: KE
    nager_name: Mashujaa Day
    name: Mashujaa Day
    kind: holiday
    source: docs/full-42/BUILD.md task 1.4 (KE Mashujaa Day 20 October)
  - market: ZA
    nager_name: Election Day
    name: Local elections
    kind: election
    source: docs/full-42/BUILD.md task 1.4 (SA local elections 4 November)

# Holidays and observances that fall on one day and month every year, keyed
# by calendar name as MM-DD. Task 3.6 uses the list only to date last year's
# analogue when last year's date.nager.at rows are not held; a held row always wins.
fixed_dates:
  source: "rule: each entry falls on the same day and month every year, so the analogue is that day and month last year; date.nager.at lists them all as public, but NG Children's Day and National Youth Day are observances, not statutory public holidays"
  ZA: {"New Year's Day": "01-01", "Human Rights Day": "03-21", "Freedom Day": "04-27", "Workers' Day": "05-01",
       "Youth Day": "06-16", "National Women's Day": "08-09", "Heritage Day": "09-24",
       "Day of Reconciliation": "12-16", "Christmas Day": "12-25", "Day of Goodwill": "12-26"}
  NG: {"New Year's Day": "01-01", "Workers' Day": "05-01", "Children's Day": "05-27", "Democracy Day": "06-12",
       "Independence Day": "10-01", "National Youth Day": "11-01", "Christmas Day": "12-25", "Boxing Day": "12-26"}
  KE: {"New Year's Day": "01-01", "Labour Day": "05-01", "Madaraka Day": "06-01", "Mazingira Day": "10-10",
       "Mashujaa Day": "10-20", "Jamhuri Day": "12-12", "Christmas Day": "12-25", "Boxing Day": "12-26"}

# Recurring moments dated by a stated rule.
# weekday: 0 is Monday, 2 is Wednesday, 3 is Thursday.
rules:
  - market: ZA
    name: Payday on the 25th
    kind: payday
    rule: monthly_day
    day: 25
    source: "rule: payday on the 25th of each month (docs/full-42/BUILD.md task 1.4 hand list)"
  - market: ZA
    name: Fuel price adjustment
    kind: fuel
    rule: monthly_nth_weekday
    nth: 1
    weekday: 2
    source: "rule: SA fuel price adjustment on the first Wednesday of each month"
  - market: KE
    name: EPRA fuel price review
    kind: fuel
    rule: monthly_day
    day: 14
    source: "rule: KE EPRA pump price review on the 14th of each month"
  - market: [ZA, NG, KE]
    name: Black Friday
    kind: commerce
    rule: yearly_nth_weekday
    month: 11
    nth: 4
    weekday: 3
    offset_days: 1
    source: "rule: Black Friday is the day after the fourth Thursday of November"
  - market: NG
    name: Detty December starts
    kind: season
    rule: yearly_date
    month: 12
    day: 1
    source: "rule: Detty December is the month of December; start row on 1 December"
  - market: NG
    name: Detty December ends
    kind: season
    rule: yearly_date
    month: 12
    day: 31
    source: "rule: Detty December is the month of December; end row on 31 December"

