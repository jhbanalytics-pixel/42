# Held-out reference list for the scorecard's lead time (ENGINE.md section 6, BUILD.md 2.7).
#
# Lifted from engine/configs/watchlist_ground_truth.yaml. Real cultural moves added from outside 42
# (news, team knowledge, culture), never from what 42 surfaced, and never a board or chart 42 collects:
# those are inputs, so scoring against them would be circular. core/detect/scorecard.py reads it only.
#
# Each entry:
#   id:           slug, unique
#   market:       ZA | NG | KE
#   title:        one line describing the move
#   event_date:   ISO date the move became obvious to everyone
#   match_terms:  lowercase terms; an item matches when a term, as written or with its spaces removed,
#                 is inside its label, key or an alias; a term under 6 characters with its spaces
#                 removed never matches
#   added:        ISO date the entry was added here
#   source:       one line on where the fact came from
#
# Honesty rule: add an entry when the move is known from outside 42, before or after 42 flagged it, and
# never because 42 flagged it. Terms must name the event, not the standing topic around it.

