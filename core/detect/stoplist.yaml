# Platform-generic tags that ride on every kind of post and name no topic, sound, place or community.
# A matching item keeps its states but is written to cultural_map with status 'generic', so it is never
# eligible (item_state.eligible false, DATA.md 3.7); the brief skips ineligible items.
# core/detect/items.py reads this file through is_generic.
#
# Lifted from the old engine: the tag entries of engine/configs/seed_graph_stoplist.yaml and
# engine/src/scoring/driving_hashtags.py DEFAULT_STOPLIST. The general English words, month and day
# names, market names and per-market function words in the old list are left out: they stopped
# tokens in free text, and as hashtags some of them are real topics. Added after the first staging
# detect run on 28 September 2026 ranked #fyp, #foryou, #viral and their kin at the top of every market.
#
# One key per item kind; only hashtags are listed. Every term is written as its canonical key:
# NFKC, casefolded, without the leading '#'. A test holds the file to that.

