# Terms that put an item in the sensitive set (contract section 12.1, rule 2): items that never appear next
# to a named creator. The political reason also takes every market's list in core/brief/political.yaml, the
# G4b list; the political terms here are protest and campaign stems the brief's gate does not need.
# A floor, not a complete list: it hides obvious cases; anything it misses is not safe to show next to a
# named person. Add a term when a real item slips past it.
#
# core/detect/sqlrun.py renders both files into v_sensitive_items (sql/agent_views.sql) as an ARRAY literal
# at apply time, so these files are the one source. In a label or an alias a term matches as whole words, in
# any case unless it is written in capitals or with a capital inside a word (IFP, PrEP); a name with no
# spaces, such as a hashtag, is also split where its capitals change, so #VoteANC reads as Vote ANC, while
# KwaZulu-Natal floods is left whole and does not read Zulu. A canonical key is a lowercase compound
# such as hivawareness, so a key matches when it is the term, holds the term among its words, holds a term of
# five letters or more anywhere inside it, or starts or ends with a term of three or four letters from this
# file (hivpositive, endgbv). Five lists change that for the terms they name, each of which also sits under
# its reason, and gives_way_to changes what a match takes away:
#   labels_only: the term matches labels and aliases only, never a key: PrEP, whose key would be #prep, and
#     419, which has no letters. A term with a digit needs a boundary that is neither letter nor digit, so
#     #419 matches and #dance1419 does not.
#   keys_only: the term never reads a label or alias, only the key, and there only as the key or one of its
#     words: tb, which a split label would find in #TBThursday.
#   whole_words_in_keys: the key must be the term or hold it among its words, nothing inside. For a token
#     that sits in ordinary words at any length: sti (stickers), gnu (gnuplot), coup (coupon), pope
#     (popeyes), condom (condominium), tik (tiki), killing (upskilling). Where its compounds are often
#     ordinary (TikTok, killing it, find your tribe), the ordinary list at the end takes the reason back.
#   start_of_keys: the key may also start with the term, never end with it or hold it inside: eid
#     (eidmubarak, not apartheid or reid), rape (rapeculture, not grapes or drape), aids (not braids).
#   anywhere_in_keys: the term matches anywhere inside a key whatever its length.
# A verb plus one of the narrow terms (endtb, stoprape, happyeid) is listed as its own compound.
# gives_way_to names, for a term, longer terms that hold it and that take its reason away when they match
# the same item and every occurrence of the term, across the key and the names, sits inside one of them:
# TB Joshua reads religion and not health and #protestant religion and not political, but
# #ProtestantChurchProtest keeps political. Nothing else takes a reason away, so an item keeps every reason
# its terms carry, and a compound is listed under every reason it carries (police brutality is political and
# crime, Biafra political and race_ethnicity).
# A false hit only keeps a topic off creator pages, the safe direction, but it also gives the topic a wrong
# reason, so a short term that sits inside common words goes on one of the narrower lists. political.yaml's
# own names and acronyms keep the G4b key rules, since at the edge of a key they would take ordinary tags
# such as #nairobi (Obi) and #zumba (Zuma). Christmas, Easter, Good Friday and Lent are left out until Albert
# decides on them.
#
# never_sensitive is checked first: an item whose canonical key, letters only, is one of these is never in
# the set, because an edge or inside rule would otherwise catch it for an ordinary reason (goddess, racecar).
# Keep it short; each entry must name a real false hit.
#
# One key per reason, plus the five rule lists, gives_way_to, never_sensitive and ordinary. No term here describes a
# person's age, and none may. v_sensitive_items stamps each row with list_version, a hash of both lists as
# rendered.

