# Lead-time evaluation ground-truth watchlist.
#
# A standing list of real cultural moves, added from OUTSIDE the engine
# (news, team knowledge, culture), never from what the engine already
# surfaced. Consumed read-only by scripts/leadtime_eval.py to measure how
# early PULSE detects a move relative to when it became mainstream-obvious.
#
# Schema per entry:
#   id:           slug, unique
#   market:       za | ng | ke
#   title:        one line, human description of the move
#   event_date:   ISO date the move became mainstream-obvious
#   match_terms:  lowercase substrings that identify the move in engine text
#   added:        ISO date this entry was added to the watchlist
#   source:       one-line receipt for where the fact came from
#
# See docs/leadtime-eval.md for how to add an entry and the honesty rule.

entries:
  - id: ke-jun25-protest-anniversary
    market: ke
    title: "Kenya 25 June protest anniversary"
    event_date: 2026-06-25
    # Anniversary-specific phrases: bare maandamano is a standing KE term
    # that matches months of unrelated briefs and fakes lead time.
    match_terms:
      - june 25 anniversary
      - anniversary protests
      - wreath
    added: 2026-07-03
    source: "3 Jul audit false-negative probe"

