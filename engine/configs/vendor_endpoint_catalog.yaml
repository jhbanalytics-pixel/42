# Vendor endpoint catalog.
#
# Source-of-truth registry of documented endpoints per vendor that the
# discovery loop in scripts/engine_evolve.py cross-references against
# actual connector code (src/ingestion/connectors/*.py). Surfaces
# "unused endpoint" candidates so we never accidentally pay for a vendor
# surface we are not calling.
#
# Update this file when:
# - A vendor publishes a new endpoint we have not catalogued
# - We deprecate an endpoint (mark deprecated: true)
# - A vendor's docs change (verify_url updated)
#
# Discovery loop output: for each documented endpoint NOT found in the
# connector code, the watchdog logs a candidate-ship recommendation.
# Endpoints can be tagged `ship_wave` so the watchdog knows when to
# stop nagging (item is already on the roadmap).

ensembledata:
  base_url: "https://ensembledata.com/apis"
  endpoints:
    - path: /tt/keyword/search
      status: in_use
    - path: /tt/hashtag/posts
      status: in_use
    - path: /tt/user/posts
      status: in_use
    - path: /tt/trending
      status: removed_dead  # HTTP 404 + absent from openapi.json (4 Jun 2026); never returned rows
    - path: /tt/post/comments
      status: dark_shipped
      ship_wave: 1
      ship_commit: b16a3c0
    - path: /instagram/hashtag/posts
      status: in_use
    - path: /instagram/user/posts
      status: in_use
    - path: /instagram/reels/keyword/search
      status: not_shipped
      ship_wave: 2
      notes: "Reels-specific endpoint. Currently we pull IG via /user/posts only."
    - path: /threads/keyword/search
      status: in_use
    - path: /threads/user/posts
      status: in_use
      ship_wave: 3
      notes: "Threads handle-specific feed. Same pattern as TikTok user/posts."
    - path: /reddit/subreddit/posts
      status: in_use
    - path: /reddit/post/comments
      status: in_use
    - path: /reddit/keyword/search
      status: in_use
    - path: /reddit/user/posts
      status: vendor_not_published
      ship_wave: 2
      notes: "13 path variants probed against EnsembleData on 28 May 2026; all returned 404. EnsembleData has not published a Reddit user-posts endpoint. Tracking specific high-signal redditors is unreachable via this vendor. Re-probe quarterly."
    - path: /reddit/subreddit/about
      status: not_shipped
      ship_wave: 3
      notes: "Sub-level metadata. Use case unclear; low priority."
    - path: /twitter/keyword/search
      status: vendor_not_published
      notes: "Confirmed 28 May docs read - vendor does not expose. Wave 1 ship configured this path but it does not exist."
    - path: /twitter/hashtag/posts
      status: vendor_not_published
      notes: "Confirmed 28 May docs read - vendor does not expose. Wave 1 ship configured this path but it does not exist."
    - path: /twitter/user/posts
      status: removed_from_code
      notes: "Wave 1 ship used this path; vendor actually exposes /twitter/user/tweets. Replaced by /twitter/user/tweets in Wave 1 patch."
    - path: /twitter/user/tweets
      status: dark_shipped
      ship_wave: 1_patch
      ship_commit: d5628e1
      notes: "Correct path per official EnsembleData docs (28 May). Replaces /twitter/user/posts."
    - path: /twitter/user/info
      status: not_shipped
      notes: "Profile metadata; documented but not wired for ingestion."
    - path: /twitter/post/info
      status: not_shipped
      notes: "Per-tweet metadata refresh; documented but not wired for ingestion."
    - path: /twitter/list/posts
      status: not_shipped
      ship_wave: 3
      notes: "Twitter List based feeds. Could mirror Reddit subreddit pattern."
    # Wave 3 (TBD): EnsembleData dark surfaces.
    - path: /youtube/channel/shorts
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Channel-level Shorts feed. Replaces Google YouTube Data API Shorts gap."
    - path: /youtube/video/comments
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Per-video comments via EnsembleData. Higher depth than Google Data API."
    - path: /youtube/channel/videos
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Channel-level video feed via EnsembleData."
    - path: /youtube/search
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Keyword search via EnsembleData. Confirmed path (NOT /youtube/keyword/search)."
    - path: /instagram/post/comments
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Per-post comments. High Gen Z signal."
    - path: /instagram/user/reels
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "User reels feed. Complements /user/posts."
    - path: /instagram/user/tagged-posts
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Posts where user is tagged. Surfaces creator collaborations."
    - path: /threads/post/replies
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Post replies. Confirmed path (NOT /threads/post/info-replies)."
    - path: /tt/music/posts
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Music-driven trend discovery (sound IDs). Adapts to TikTok's audio-virality pattern."
    - path: /tt/post/comments-replies
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Per-comment replies. Note: DOUBLE-PLURAL path per vendor docs."
    - path: /tt/post/info
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Per-video metadata refresh. Was Wave 2 candidate; promoted to Wave 3 dark ship."
    - path: /tt/post/multi-info
      status: dark_shipped
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Bulk per-video metadata. Cheaper than N x /tt/post/info."
    # Free customer endpoints (code_landed_flag_off, engine-pulse consumes immediately).
    - path: /customer/get-used-units
      status: code_landed_flag_off
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Free endpoint. engine-pulse reads to confirm live unit spend vs ledger projection."
    - path: /customer/get-history
      status: code_landed_flag_off
      ship_wave: 3
      ship_commit: d5628e1
      notes: "Free endpoint. Historical unit-spend by date for drift analysis."

