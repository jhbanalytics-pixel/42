spotify:
  base_url: "https://api.spotify.com/v1"
  notes: "PERMANENTLY DISABLED. Spotify Web API client_credentials flow deprecated 27 Nov 2024 for new apps; rolling cutoff retires existing apps. Replaced by Apple Music RSS Charts (commit 66abb7a). Catalog block retained as documentation in case Spotify reopens access."
  endpoints:
    - path: /playlists/{id}/tracks
      status: permanently_disabled
      ship_wave: 1
      ship_commit: b16a3c0
      notes: "Shipped Wave 1 b16a3c0 default-off; never activated. Spotify Web API client_credentials flow deprecated; superseded by Apple Music RSS Charts (commit 66abb7a)."
    - path: /search
      status: permanently_disabled
      ship_wave: 3
      notes: "Superseded by Apple Music RSS Charts (commit 66abb7a). No path forward without Spotify reopening client_credentials access."

bigquery_trends:
  base_url: "bigquery-public-data.google_trends"
  endpoints:
    - path: international_top_rising_terms
      status: in_use
    - path: international_top_terms
      status: dark_shipped
      ship_wave: 2
      ship_commit: 8ad51c7
      notes: "Steady-state terms (not just rising). Adds confidence for cultural staples. top_terms.enabled flag default-off."

apple_music:
  base_url: "https://rss.marketingtools.apple.com/api/v2"
  notes: "Replaces Spotify (deprecated client_credentials flow). Free, no auth, no quota. RSS Charts shipped 28 May 2026 (commit 66abb7a)."
  endpoints:
    - path: /{market}/music/most-played/50/songs.json
      status: in_use
      ship_commit: 66abb7a
      notes: "Top 50 most-played songs per market (ZA, NG, KE). 50 tracks × 3 markets = 150 rows/day target."

rss_feeds:
  base_url: "(publisher-owned RSS endpoints; see configs/sources.yaml rss.feeds)"
  notes: "Direct RSS pulls per publisher. Connector sends a single static polite-bot User-Agent ('Mozilla/5.0 (compatible; OgilvyTrendsEngineV2/1.0; +https://github.com/jhbanalytics-pixel/trends-engine-v2)') on every fetch. No UA rotation, no Referer header. The polite-bot identifier honours publisher robots-policy preferences by declaring the project and a contact URL so traffic is traceable."
  endpoints:
    - path: news24.com/rss
      status: in_use
      notes: "Polite-bot UA sufficient to bypass default-urllib 403."
    - path: iol.co.za/cmlink/1.730
      status: not_shipped
      notes: "Not present in configs/sources.yaml. IOL listed in connector comment as 403-bot-protected; no active feed entry. Re-probe and add to sources.yaml if unblocked."
    - path: premiumtimesng.com/feed
      status: in_use
      notes: "Polite-bot UA sufficient to bypass default-urllib 403."
    - path: dailymaverick.co.za/dmrss
      status: vendor_not_published
      notes: "WAF-blocked 28 May 2026; Cloudflare challenge page returned on every probe. Polite-bot UA insufficient. No workaround at the connector layer; needs server-side fetch from a non-blocked egress IP. Re-probe quarterly."
    - path: guardian.ng/feed
      status: vendor_not_published
      notes: "WAF-blocked 28 May 2026; Cloudflare challenge page returned on every probe. Polite-bot UA insufficient. No workaround at the connector layer; needs server-side fetch from a non-blocked egress IP. Re-probe quarterly."

