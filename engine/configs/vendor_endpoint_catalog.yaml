  # Every endpoint below is permanently_disabled so the discovery loop never
  # surfaces a flip on a cancelled vendor; the paths stay as a record.
  base_url: "https://api-data.brand24.com/api-data/v1"
  endpoints:
    - path: /project/{pid}/topics
      status: permanently_disabled
    - path: /project/{pid}/trending-hashtags
      status: permanently_disabled
    - path: /project/{pid}/most-followers
      status: permanently_disabled
    - path: /project/{pid}/trending-links
      status: permanently_disabled
    - path: /project/{pid}/mentions
      status: permanently_disabled
      ship_commit: 97d61c7
      notes: "Live + flipped 28 May (commit 97d61c7). include_mentions=true across all 3 projects post-vendor-contract validation."
    - path: /project/{pid}/ai-insights
      status: permanently_disabled
      ship_wave: 1
      ship_commit: b16a3c0
    - path: /project/{pid}/mentions/sentiment
      status: permanently_disabled
      ship_wave: 2
      ship_commit: 8ad51c7
      notes: "Per-mention sentiment scores. Pairs with the /mentions stream. include_mentions_sentiment flag default-off per project."
    - path: /project/{pid}/mentions/reach
      status: permanently_disabled
      ship_wave: 2
      ship_commit: 8ad51c7
      notes: "Per-mention reach estimates. Adds engagement signal not in /mentions. include_mentions_reach flag default-off per project."
    - path: /project/{pid}/mentions/count
      status: permanently_disabled
      ship_wave: 3
      notes: "Daily rollup. Useful for the engine-pulse cap math; lower priority than reach."
    - path: /project/{pid}/daily-metrics
      status: permanently_disabled
      ship_wave: 2
      ship_commit: 8ad51c7
      notes: "Per-project daily rollup. Adds 'today vs 7-day baseline' health signal at zero unit cost. include_daily_metrics flag default-off per project."

