  # 11 Jun 2026 Gemini brand lens (stage 1). Zodiac and horoscope "gemini"
  # collisions are stripped at classification time via
  # src/utils/geo_blocklist.py TOPIC_GEO_BLOCKLIST["tech_gemini_ai"].
  # 17 Jun 2026 (KE precision): bare "gemini" and bare "veo" dropped. Over 30
  # days they pulled about 1018 KE noise rows (zodiac, the Wright Gemini bus,
  # the Tory Burch Gemini tote, a Vietnamese singer, foreign-language AI
  # chatter) against about 559 genuine; the AI-context keywords below keep 557
  # of the 559 while cutting the noise. The blocklist above is the safety net.
