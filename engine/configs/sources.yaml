# ---------------------------------------------------------------------------
# BigQuery Google Trends Public Dataset
# ---------------------------------------------------------------------------
# Source: bigquery-public-data.google_trends.international_top_rising_terms
# active=true keeps the connector live; flip to false to skip it entirely.
# days+limit pass through to infra/bigquery_queries/search_velocity_terms.sql.
# expected_per_market declares which markets should return non-zero rows.
# KE is intentionally False: verified 28 May 2026 the public dataset has zero
# KE rows all-time (only KR present in K-prefix codes). If a True market
# returns 0, the connector ERROR-logs and the per-market floor in
# configs/alerts.yaml (pipeline_health.bigquery_trends_per_market_min) trips.
# Override here if Google adds KE coverage; keep alerts.yaml in lockstep.
bigquery_trends:
  active: true
  days: 7
  limit: 100
  expected_per_market:
    za: true
    ng: true
    ke: false
  # Wave 2 dark (28 May 2026): international_top_terms steady-state feed.
  # Flip after live probe per validate-vendor rule. KE has zero coverage
  # in the public dataset (verified 28 May), so expected=false on KE.
  top_terms:
    enabled: true
    days: 7
    limit: 100
    expected_per_market:
      za: true
      ng: true
      ke: false

# ---------------------------------------------------------------------------
# YouTube Queries -- per market with region codes
#
# Quota budget: each market issues at most max_calls_per_run search.list
# calls per run (100 units each). Keep the list at 4 high-signal terms per
# market so 3 markets x 4 calls = 1200 quota units, leaving ~8800 units of
# daily buffer for retries. See src/ingestion/connectors/youtube.py for
# the full quota math. Do NOT re-add generic "gen z" / "student life"
# terms here. GDELT and Ensemble already cover that ground and the
# culturally-distinctive terms (amapiano, afrobeats, gengetone, japa,
# nightlife) carry the actual signal on YouTube.
# ---------------------------------------------------------------------------
youtube_queries:
  za:
    region_code: ZA
    # yt-dlp uncapped YouTube search (free, no API key, no 10K quota). Enabled
    # 3 Jul 2026. android player-client survives Cloud Run datacenter IPs. Bounded
    # + fail-safe: a yt-dlp error is a non-fatal degradation, not a market failure.
    scrape_enabled: true
    scrape_max_results: 30
    scrape_max_terms: 25
    trending_enabled: true            # /videos.list chart=mostPopular (1 unit each)
    comment_threads_enabled: true     # commentThreads top 5 videos/market (5 units)
    comment_videos_per_run: 5
    max_calls_per_run: 7  # 21 Jun 2026: cover all 7 terms (4 evergreen + 2 event seeds + gemini lens), 7x100x3mkt = 2100/10000 units
    queries:
      - amapiano south africa
      - jozi nightlife
      - south african creators
      - south africa side hustle
