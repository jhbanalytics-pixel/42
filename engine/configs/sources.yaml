# ---------------------------------------------------------------------------
google_trends_rss:
  enabled: true  # flipped 4 Jul 2026 after three-market live probe (ZA/NG/KE all 200, real terms)
  markets:
    za:
      geo: ZA
    ng:
      geo: NG
    ke:
      geo: KE

# Wikipedia per-country top pageviews (free, no auth, CC BY-SA aggregates).
# Flip proposed 3 Jul 2026 after a three-market live probe: ZA 200 with 39
# articles (real signal, e.g. Yusuf Cassim trending), NG 200 with 9 (Michael
# Olise, World Cup), KE 200 with 4 (sparse under privacy rounding, harmless).
# Family is "wikipedia" (attention), not news; corroboration counts it as its
# own channel. Rollback: enabled false.
wikipedia:
  enabled: true
  limit: 40
  days: 3

# Audiomack trending (dark, 4 Jul 2026). NG-dominant streaming platform.
# OAuth1 consumer keys requested from Audiomack; connector returns empty
# without AUDIOMACK_CONSUMER_KEY/_SECRET even when enabled. The API is not
# geo-scoped, so market attribution here is a per-market genre pool
# heuristic only, not real geo-scoping; genre slugs are docs-derived and
# must be validated in the pre-flip live probe.
audiomack:
  enabled: false
  markets:
    za:
      genres: [amapiano, house]
    ng:
      genres: [afrobeats, afropop]
    ke:
      genres: [afrobeats, gengetone]

# Cloudflare Radar per-country top domains (dark, 4 Jul 2026). Free API
# token (CLOUDFLARE_RADAR_TOKEN), data CC BY 4.0, cite Cloudflare Radar.
# Response envelope is docs-derived; validate in the pre-flip live probe.
cloudflare_radar:
  enabled: true  # flip gated on Secret Manager wiring; probe 4 Jul: 10 rows/market via live token
  limit: 25
  markets:
    za:
      location: ZA
    ng:
      location: NG
    ke:
      location: KE
