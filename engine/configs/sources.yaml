      facebook_pages:
        ["100068189748310", "100064817165112", "100064830964890", "100064903473480",
         "100064604417137", "100070150435861", "100064471732809"]
      facebook_groups: ["369205615472953"]
    ng:
      creator_tiers: [tier_1, tier_2]
      terms:
        - afrobeats
        - naija
