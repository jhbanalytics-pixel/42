ensembledata:
  # Hashtag + keyword pools per market. ensemble_budget above caps how many
  # of these actually fire per run. Pools are intentionally kept to
  # market-native terms only. Globally-generic terms (nightlife, streetwear,
  # studentlife, dating) were removed 24 Apr PM after Thapelo flagged that
  # TikTok was pulling out-of-region content. TikTok's own API does not
  # expose geographic filtering, so keeping the hashtag set native is the
  # primary levers. Connector also drops posts written in non-Latin scripts
  # as a second line of defence.
