# ---------------------------------------------------------------------------
# SocialCrawl. PRIMARY social ingestion vendor from 23 Jul 2026, when
# EnsembleData was cancelled. One x-api-key, unified {computed, post} schema,
# pay-as-you-go credits (20,000 bought 23 Jul). Rows land as source=socialcrawl
# with the REAL platform in the platform column, so scoring, seed_graph and the
# creator watchlist treat them exactly as they treated the EnsembleData rows.
#
# Spend model. budget_credits_per_run is a per-RUN cap shared across all three
# markets, not a target. phase_share splits that cap so a fat phase cannot
# starve a later one; creators takes the largest share to collect curated
# creator posts. caps bound the per-surface fan-out inside each phase.
#
# Do not read a daily burn rate, or a runway, out of this file. The numbers
# that used to sit here described a cap that was raised on 27 Jul 2026, and
# several different figures have been quoted as the burn since. Measure it:
# SUM(socialcrawl_credits) per day from pipeline_runs. Runway is bounded by the
# BALANCE, a free call to GET /v1/credits/balance, not by any modelled day
# rate. Same warning lives in configs/engine_capacity.yaml under
# connectors.socialcrawl; neither file is a source of truth for spend.
#
# Surface choices are live-probed, not docs-derived (23 Jul 2026,
# docs/socialcrawl-probe-2026-07-23.md). Three traps, each of which returns
# zero rows silently if you follow the OpenAPI spec:
#   - tiktok/search returns 0 items with ANY date_posted or region value, so
#     TikTok keyword search runs on tiktok/search/top + publish_time instead.
#   - youtube/search uploadDate is `this_week`, not `week`.
#   - twitter/user/tweets is unsorted, dates are Twitter-format, and
#     author.username is null; max_age_days does the filtering.
# google_trends/rising is deliberately absent: it timed out upstream on probe.
#
# Rollback: enabled false returns an empty frame and makes zero network calls.
# ---------------------------------------------------------------------------
socialcrawl:
  enabled: true
  # Raised 500 -> 620 on 27 Jul 2026 to fund the facebook phase and the reddit
  # sort sweep. This is the per-RUN breaker, not the target. It was sized
  # against a day rate modelled at the time of the raise, which was never a
  # measurement and has not been reconciled against pipeline_runs since.
  budget_credits_per_run: 620
  max_age_days: 21
  timeout: 45
  phases: [discover, creators, search, reddit, accounts, news, facebook]
  # Reweighted for seven phases. Each share is the phase's modelled need plus
  # roughly a quarter of headroom, summing to 0.95 so no phase can starve a
  # later one and the run still keeps 5% slack.
  phase_share:
    discover: 0.06
    creators: 0.32
    search: 0.22
    reddit: 0.16
    accounts: 0.04
    news: 0.05
    facebook: 0.10
  caps:
    creators_per_platform: 40
    search_terms: 14
    threads_terms: 8
    subreddits: 10
    reddit_queries: 6
    twitter_handles: 5
    news_queries: 6
    youtube_trending: 25
    # Reddit sort sweep. Measured 27 Jul 2026 per subreddit, 1 credit a call:
    # hot page 1 = 23-24 rows, hot page 2 = +23-24 unique, top/week = +13-17
    # unique. `rising` is excluded in code because it returns hot's exact set.
    # Restores depth lost when the EnsembleData Reddit connector retired: it
    # swept three sorts for 1,657 rows/day against this connector's 419.
    reddit_pages: 2
    # Facebook. Pages answer THREE posts a call, so volume is paging not
    # breadth, and the honest rate is ~3 rows per credit, the worst on the
    # vendor. That is the price of the channel: there is no keyword post
    # search for Facebook at any price (only adlibrary, marketplace and
    # events), so a curated id list is the only route in.
    facebook_pages: 8
    facebook_page_pages: 3
    facebook_groups: 2
    # Verified creator country via tiktok/profile/region, 1 credit per handle
    # and 0 on a vendor cache hit. Stamps v2locations. Live check on the 26
    # tier_1 TikTok handles, 23 Jul 2026: 17 verified in-market, 3 registered
    # to a DIFFERENT country (a ZA-watchlist handle registered NG, an NG one
    # US, a KE one SA), 6 unresolved. EnsembleData could not see this at any
    # price. Read it as the account's region setting, not audience geography.
    geo_verify: 12
  markets:
    za:
      creator_tiers: [tier_1, tier_2]
      # Same market-native pools the EnsembleData block used, so the switch
      # does not also change what the engine is looking for.
      terms:
        - amapiano
        - mzansi
        - kasi
        - stokvel
        - nsfas
        - matric
        - braai
        - jozi
        - soft life south africa
        - side hustle south africa
        - amapiano challenge
        - south african creators
        - kasi vibes
        - load shedding
      # Pruned 27 Jul 2026: MzansiTV and BraaiMeat returned zero rows under
      # every sort and still billed a credit each. Durban added, probed live
      # at 24 posts all inside 7 days.
      subreddits:
        [southafrica, Amapiano, CapeTown, johannesburg, PersonalFinanceZA, Springboks,
         SouthAfricanMusic, AskSouthAfrica, Durban]
      reddit_queries:
        ["south africa culture", "amapiano", "load shedding", "nsfas", "mzansi", "stokvel"]
      # Rebuilt 3 Aug 2026 on FRESH-POST COUNT, not newest-post date. A handle
      # answers either ~20 rows nearly all from the last week, or ~100 rows of
      # archive carrying a single recent post, so row count reads backwards:
      # the SHORT response is the live one. Kept handles return 18-20 fresh
      # posts a day each; IOL is the best of the 1-fresh fillers. Dropped as
      # stale: News24 (newest 2025-10-25), casspernyovest (2025-02-07),
      # DjMaphorisa (2025-10-24), AdvoBarryRoux (2026-03-22). Soccer_Laduma
      # resolves but yields 1 fresh post a day and loses its slot.
      twitter_handles: [GovernmentZA, SundayTimesZA, PresidencyZA, Newzroom405, IOL]
      news_queries:
        ["South Africa culture", "amapiano", "South Africa economy", "Bafana Bafana",
         "South Africa load shedding", "Mzansi entertainment"]
      # eNCA, News24, Sowetan, TimesLIVE, SABC, Metro FM, IOL. Every id
      # harvested from post.ext.author_id and verified serving same-day posts
