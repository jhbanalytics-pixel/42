# ---------------------------------------------------------------------------
# GDELT GKG (BigQuery public dataset) -- global settings
# ---------------------------------------------------------------------------
gdelt:
  active: true
  # days=2 (not 1): _PARTITIONTIME is day-truncated, so at the early 00:30
  # UTC primary fire a 1-day window resolves to only the ~33 min current-day
  # partition. 2 spans the full prior-day partition and restores GDELT volume.
  days: 2
  limit: 2000
  # Phase 2 (27 May 2026): slang_filter_enabled biases GDELT GKG row intake
  # toward market-native slang rather than generic country news that
  # dominates the raw feed. Pattern built from gdelt_slang.<market> below.
  # Empty list disables the filter and falls through to country-only.
  slang_filter_enabled: true
  # Wave 1 (b16a3c0, 28 May 2026): GCAM emotional cognitive dimensions
  # (100+ dims per article; 5-dim parser surfaces anger/anxiety/joy/etc).
  # Schema migration for raw_content.v2gcam column deferred; parser logs
  # signal so we can validate before committing to the column.
  gcam_enabled: true
  # Wave 1 (b16a3c0, 28 May 2026): GDELT Events table (gdelt-bq.gdeltv2
  # .events_partitioned). Row-level civil unrest / protest / assault /
  # fight signal. CAMEO 3-letter country codes (SAF/NGA/KEN) NOT FIPS.
  # event_root_filter default captures protest/force/coerce/assault/fight.
  gdelt_events_enabled: true
  event_days: 1
  event_limit: 500
  gdelt_event_root_filter: "^(14|15|17|18|19)$"

# GDELT slang patterns per market. Each term is regex-escaped + lower-cased
# then OR'd into a single alternation. Multi-word terms (e.g. "jua kali")
# match literally. Keep terms culturally specific; "south africa" or
# "kenya" would re-include the country-wide noise we are filtering out.
gdelt_slang:
  # 28 May 2026 fix: SQL filter now matches V2Persons only (not the full
  # themes+persons+orgs concat which dropped daily volume ~99%). Lists
  # expanded with named entities (politicians, musicians, athletes) that
  # V2Persons actually surfaces for our markets. Original cultural slang
  # is retained -- the match is OR'd, so any single hit qualifies the row.
  za:
    - amapiano
    - kasi
    - softlife
    - sidehustle
    - mzansi
    - stokvel
    - nsfas
    - braai
    - bafana
    - springboks
    - tyla
    - kabza
    - focalistic
    - cassper
    - ramaphosa
    - malema
  ng:
    - afrobeats
    - sapa
    - japa
    - naija
    - owambe
    - jollof
    - nollywood
    - ankara
    - asoebi
    - super eagles
    - tinubu
    - davido
    - wizkid
    - asake
    - burna
    - rema
    - tems
    - atiku
    - osimhen
    - lookman
  ke:
    - gengetone
    - sheng
    - mtaani
    - jua kali
    - mama mboga
    - arbantone
    - finance bill
    - matatu
    - mitumba
    - harambee stars
    - ruto
    - raila
    - sauti sol
    - octopizzo
    - eric omondi
    - mulamwah
    - crazy kennar
    - harambee

