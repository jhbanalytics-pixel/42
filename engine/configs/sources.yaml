    creator_endpoints_enabled: true   # /tt/user/posts + /instagram/user/posts + /threads/user/posts
    creator_tier_cap: tier_1          # peak Gen Z anchors only
    # Wave 1 patch (28 May): only /twitter/user/tweets exists in vendor docs. Keyword/hashtag paths removed.
