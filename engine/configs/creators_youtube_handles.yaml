# Budget projection (when playlist_items_enabled is flipped true per market):
#
# Active handles probed: ZA=5 + NG=5 (with Davido) + KE=7 (with Sauti + Octopizzo) = 17 creators.
# Per cron run cost: 17 × 2 units (channels.list + playlistItems) = 34 units.
# With per-process cache hit on channel-id resolution after first call,
# steady-state day cost: 17 × 1 unit = 17 units.
# Quota: 10,000 / day. Burn: 0.17 - 0.34 %. Negligible.
#
# Expected row impact at full activation:
# 17 creators × 20 latest videos = ~340 new rows / day in raw_content tagged
# content_type=youtube_channel_upload, query_group=youtube_playlist_items.
