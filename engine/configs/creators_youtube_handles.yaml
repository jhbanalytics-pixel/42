# Creators YouTube Handle Registry
#
# Research registry only. The live YouTube connector does NOT read this file.
# The handle list it actually uses lives in sources.yaml under
# youtube_queries.{market}.playlist_creator_handles and must be updated there.
# Keep this file as a parallel reference; edits here have no runtime effect.
#
# Why a separate file (not creators/{m}.yaml):
# - The creators YAMLs are bare lists of names + tier labels. Adding a
#   per-creator handle map there would require schema migration that
#   ripples through scoring + watchlist logic. Lower blast radius to
#   keep this as a parallel registry.
# - Research probe 28 May 2026 verified live channel state per creator.
#   This file is the artefact.
#
# Update this file when:
# - A creator launches a YouTube channel (move from no_youtube_channel
#   to active_handles under the appropriate tier).
# - A creator goes dormant (move to dormant_handles with last-upload date).
# - A handle changes (vendor rename, verified rebrand).
#
# Numbers in parens are subscriber counts at time of research probe.
# Last-upload date is YYYY-MM-DD.

