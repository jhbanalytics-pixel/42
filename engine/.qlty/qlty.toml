config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[exclude]]
plugins = ["bandit"]
file_patterns = ["tests/**"]

# B608 SQL injection on f-string SQL: project policy is to bind
# caller-supplied values via QueryJobConfig parameters and to validate
# any identifier (table, column, market code) via _validate_identifier()
# in src/utils/bigquery.py or via _ALLOWED_* whitelists in
# src/alerts/detector.py before interpolation. bandit cannot see the
# validation, so the rule is suppressed. Reviewers must check identifier
# validation on any new SQL-building code.
[[ignore]]
plugins = ["bandit"]
rules = ["B608"]
file_patterns = ["src/**/*.py", "scripts/**/*.py"]

# Secret Manager resource NAMES, never values: bandit reads the identifier
# strings as hardcoded passwords. The values live only in Secret Manager.
[[ignore]]
plugins = ["bandit"]
rules = ["B105", "B106"]
file_patterns = [
  "src/analysis/open_intelligence/funded_lane_runtime.py",
  "src/ingestion/connectors/socialcrawl.py",
  "scripts/run_rss_now.py",
  "scripts/staging/run_source_lab_snapshot.py",
  "scripts/staging/deploy_open_intelligence_job.py",
]

# Operational one-shot scripts that invoke gcloud with fixed argument lists
# built from module constants; no untrusted input reaches the subprocess.
[[ignore]]
plugins = ["bandit"]
rules = ["B404", "B603"]
file_patterns = [
  "scripts/staging/deploy_open_intelligence_job.py",
  "scripts/staging/provision_open_intelligence_staging.py",
  "scripts/verify_gemini_canary_mutations.py",
]

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
