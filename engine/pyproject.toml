[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trends-engine-v2"
version = "0.1.0"
description = "Automated cultural trend detection pipeline for Sub-Saharan Africa"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Albert Meintjes", email = "albert.meintjes@ogilvy.co.za"}]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0",
    "google-cloud-bigquery>=3.14.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "pandas-gbq>=0.26.1",
    "db-dtypes>=1.2.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-pubsub>=2.18.0",
    "google-cloud-secret-manager>=2.16.0",
    "google-cloud-logging>=3.5.0",
    "google-cloud-aiplatform>=1.40.0",
    "google-genai==2.20.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.22.0",
    "google-auth-oauthlib>=1.0.0",
    # OAuth 1.0a request signing for the Audiomack connector.
    "requests-oauthlib>=1.3.1",
    "gspread>=6.0.0",
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    # Hardened XML parsing for the google_trends_rss connector; imported at
    # module level, so it must be declared or the cron crashes on import.
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.2",
    # Round-trip YAML (comment-preserving) for engine_evolve --apply rewrites
    # of engine_capacity.yaml; PyYAML's safe_dump strips comments.
    "ruamel.yaml>=0.18.0",
    "python-dateutil>=2.9.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.1",
    "langdetect>=1.0.9",
    # Uncapped YouTube search for the youtube_scrape connector (no API key, no
    # quota). Pin a recent release: the android player-client path that survives
    # Cloud Run datacenter IPs needs 2025.05.22 or newer.
    "yt-dlp>=2025.5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.24.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "detect-secrets>=1.4.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
# Scripts legitimately sys.path.insert before src imports and print to stdout.
"scripts/**/*.py" = ["E402", "T20", "F401", "RUF015", "F541", "B905"]
# Tests use leading-underscore fixture injections intentionally; PT001
# (require @pytest.fixture()) clashes with ruff format which strips the
# empty parens, so the rule is effectively un-enforceable here.
"tests/**/*.py" = ["PT001", "PT011", "PT019", "PT006", "PT004", "E402", "F401", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring external services",
    "e2e: end-to-end tests hitting real infrastructure",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 1
show_missing = true

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
