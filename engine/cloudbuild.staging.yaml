steps:
  - id: unit-tests
    name: gcr.io/cloud-builders/docker@sha256:e036091375b816e40f07620582d1dfaa0e2c2da58ea5731fdcf560534b2a4a57
    args:
      - build
      - --file
      - Dockerfile.tests
      - --tag
      - 42-engine-tests:${BUILD_ID}
      - .

  - id: build-staging-image
    name: gcr.io/cloud-builders/docker@sha256:e036091375b816e40f07620582d1dfaa0e2c2da58ea5731fdcf560534b2a4a57
    args:
      - build
      - --file
      - Dockerfile.staging
      - --tag
      - 42-staging-candidate:${BUILD_ID}
      - .

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
