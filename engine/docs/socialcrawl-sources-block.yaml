# ---------------------------------------------------------------------------
# Two flag flips in the SAME file, both one line each. EnsembleData was
# cancelled, so its token will start returning auth errors; leaving these on
# spends the whole ingestion window retrying a dead vendor before the
# replacement surfaces run.
#
#   ensemble_budget.enabled:  true  ->  false   (line ~370)
#   reddit.enabled:           true  ->  false   (line ~1000, the Reddit
#                                                connector bills the dead
#                                                EnsembleData ledger; its
#                                                subreddit + keyword coverage
#                                                moves to the socialcrawl
#                                                `reddit` phase above)
# ---------------------------------------------------------------------------
