      reddit_queries:
        ["kenya youth", "gengetone", "kenya finance bill", "nairobi", "sheng", "mpesa"]
      twitter_handles: [NTVKenya, CitizenTVKenya, StandardKenya, BahatiKenya, KenyaPower]
